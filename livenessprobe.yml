apiVersion: v1
kind: Pod
metadata:
  name: liveness-pod
  labels:  
    app: dev-pod
    env: dev
spec:
  containers:
    - name: liveness-container 
      image: busybox   
      ports:
        - containerPort: 80
          protocol: TCP
      livenessProbe:
        tcpSocket: 
          port: 80         
      startupProbe:
        httpGet:
          path: ./rajashekar
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 5
        successThreshold: 1
        failureThreshold: 3
